# /etc/ntfy-send.conf - configuration de ntfy-send.sh
#
# Ce fichier doit appartenir à root avec les droits 0600 (ou 0400) :
# le topic fait office de mot de passe, ntfy-send.sh refuse un fichier
# lisible par d'autres comptes.
#
#   install -o root -g root -m 0600 ntfy-send.conf /etc/ntfy-send.conf
#
# Format : CLE=valeur, une par ligne, sans indentation. Les lignes vides et
# celles qui commencent par # sont ignorées. Le fichier est lu, jamais
# exécuté : seules les clés ci-dessous sont reconnues.

# Serveur ntfy, sans le topic. Par défaut : https://ntfy.sh
NTFY_SERVER=https://ntfy.sh

# Topic : lettres, chiffres, _ et - uniquement, 64 caractères au maximum.
# Choisissez une valeur aléatoire, par exemple avec :
#   tr -dc 'A-Za-z0-9_-' </dev/urandom | head -c 32; echo
NTFY_TOPIC=

# Jeton d'accès facultatif (préfixe tk_), si vous utilisez un compte ntfy
# ou un serveur protégé par des ACL.
#NTFY_TOKEN=
