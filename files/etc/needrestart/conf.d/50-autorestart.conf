# /etc/needrestart/conf.d/50-autorestart.conf - installé par needrestart-ntfy
#
# Ce fichier est du Perl, évalué par needrestart après needrestart.conf.
# Vérification de son chargement :
#   needrestart -v -r l 2>&1 | grep eval

# Relance automatique des services, y compris quand needrestart est appelé
# par unattended-upgrades (le mode 'i' y retomberait en mode liste).
$nrconf{restart} = 'a';

# Pour exclure un service du relancement automatique (exemple) :
# $nrconf{override_rc}{qr(^mariadb)} = 0;

# Relance automatique de systemd-logind, exclu par défaut (bogue Debian
# #798097, concerne X.org). À n'activer que sur un serveur sans X, après un
# essai manuel. La clé doit être identique à celle de needrestart.conf.
#$nrconf{override_rc}{qr(^systemd-logind)} = 1;
